apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-python
  labels:
    app: session17-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-python
  template:
    metadata:
      labels:
        app: session17-python
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: session17-python
          # __IMAGE_TAG__ is replaced with the git commit SHA by the pipeline
          image: hey-cicd:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent   # image is side-loaded into kind; on a real cluster: ghcr.io/<user>/hey-cicd + Always
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
